<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="perplexed — it looks like a paywall, it's a pane of glass">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fcfaf6"/><stop offset="1" stop-color="#f3eee4"/>
    </linearGradient>
    <filter id="cardsh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#3a3024" flood-opacity="0.14"/>
    </filter>
    <filter id="modalsh" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2a2116" flood-opacity="0.20"/>
    </filter>
    <filter id="veil"><feGaussianBlur stdDeviation="1.1"/></filter>
    <style>
      .serif  { font-family: Georgia, 'Times New Roman', serif; }
      .sans   { font-family: 'Helvetica Neue', Helvetica, sans-serif; }
      .mono   { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="470" fill="url(#paper)"/>
  <rect x="0.5" y="0.5" width="1199" height="469" fill="none" stroke="#e3dccf"/>

  <!-- ===================== LEFT: the statement ===================== -->
  <g>
    <text x="66" y="86" class="mono" font-size="12.5" letter-spacing="2.5" fill="#17838d">READ-ONLY UX AUDIT<tspan dx="22" fill="#c9c0b1">/</tspan><tspan dx="22" fill="#9a9184">PERPLEXITY JOB REPORT</tspan></text>

    <text x="60" y="202" class="serif" font-size="106" fill="#211c16" letter-spacing="-2">perplexed</text>

    <text x="66" y="264" class="serif" font-style="italic" font-size="31" fill="#2a241d">It looks like a paywall.</text>
    <text x="405" y="264" class="serif" font-size="31" fill="#17838d">It’s a pane of glass.</text>

    <g class="sans" font-size="15.5" fill="#6f665a">
      <text x="66" y="322">Every result card is already in the page, in full. I went looking for a way</text>
      <text x="66" y="346">past the lock and found there was no lock. Here is what I found instead.</text>
    </g>

    <line x1="66" y1="384" x2="640" y2="384" stroke="#e0d8ca"/>
    <g class="mono" font-size="12.5" fill="#8a8175">
      <text x="66" y="414">4 findings</text>
      <text x="168" y="414" fill="#c9c0b1">/</text>
      <text x="188" y="414">0 bypasses</text>
      <text x="300" y="414" fill="#c9c0b1">/</text>
      <text x="320" y="414">nothing defeated to find them</text>
    </g>
  </g>

  <!-- ===================== RIGHT: the thing itself ===================== -->
  <g transform="translate(706,58)">
    <!-- report card -->
    <rect x="0" y="0" width="452" height="354" rx="16" fill="#ffffff" stroke="#efe9df" filter="url(#cardsh)"/>

    <!-- count header -->
    <text x="28" y="46" class="sans" font-size="12" letter-spacing="0.3" fill="#9a9184">Roles identified</text>
    <text x="28" y="88" class="serif" font-size="44" fill="#211c16">7</text>
    <text x="70" y="86" class="mono" font-size="11.5" fill="#17838d">…over 5 cards  ›  F-01</text>
    <line x1="28" y1="108" x2="424" y2="108" stroke="#efe9df"/>

    <!-- the five rows (all real, all present) -->
    <g>
      <!-- row 1 -->
      <text x="28" y="140" class="sans" font-size="13" fill="#c3baac">1</text>
      <text x="52" y="140" class="sans" font-size="14" font-weight="600" fill="#2a241d">Tech-policy roles, privacy-focused</text>
      <text x="52" y="159" class="sans" font-size="11.5" fill="#a49b8d">law × technology × privacy — a clean fit</text>
      <line x1="28" y1="176" x2="424" y2="176" stroke="#f2ede4"/>
      <!-- row 2 -->
      <text x="28" y="204" class="sans" font-size="13" fill="#c3baac">2</text>
      <text x="52" y="204" class="sans" font-size="14" font-weight="600" fill="#2a241d">Climate &amp; sustainability positions</text>
      <text x="52" y="223" class="sans" font-size="11.5" fill="#a49b8d">ESG, B-Corps, mission-driven orgs</text>
      <line x1="28" y1="240" x2="424" y2="240" stroke="#f2ede4"/>
    </g>

    <!-- rows 3–5: drawn in full, then veiled -->
    <g filter="url(#veil)" opacity="0.9">
      <text x="28" y="268" class="sans" font-size="13" fill="#c3baac">3</text>
      <text x="52" y="268" class="sans" font-size="14" font-weight="600" fill="#2a241d">Impact-focused legal fellowships</text>
      <text x="52" y="287" class="sans" font-size="11.5" fill="#a49b8d">public-interest labs and policy fellowships</text>
      <text x="28" y="316" class="sans" font-size="13" fill="#c3baac">4</text>
      <text x="52" y="316" class="sans" font-size="14" font-weight="600" fill="#2a241d">Data governance &amp; AI regulation</text>
      <text x="52" y="335" class="sans" font-size="11.5" fill="#a49b8d">algorithmic accountability, data ethics</text>
    </g>
    <!-- the frost: a translucent pane, not a wall -->
    <rect x="1" y="248" width="450" height="105" rx="0" fill="#ffffff" opacity="0.55"/>
    <rect x="1" y="248" width="450" height="105" fill="#f7f3ec" opacity="0.18"/>

    <!-- the modal -->
    <g transform="translate(96,232)" filter="url(#modalsh)">
      <rect x="0" y="0" width="260" height="118" rx="16" fill="#ffffff"/>
      <circle cx="130" cy="30" r="15" fill="#f1ede6"/>
      <rect x="123" y="24" width="14" height="11" rx="2.5" fill="none" stroke="#8a8175" stroke-width="1.6"/>
      <path d="M126 24 v-3 a4 4 0 0 1 8 0 v3" fill="none" stroke="#8a8175" stroke-width="1.6"/>
      <text x="130" y="64" text-anchor="middle" class="serif" font-size="16" fill="#211c16">Unlock the full workflow</text>
      <rect x="30" y="80" width="200" height="26" rx="13" fill="#262019"/>
      <text x="130" y="97" text-anchor="middle" class="sans" font-size="12" fill="#f5f1ea">Unlock workflow</text>
    </g>
  </g>

  <!-- caption tying the art to the claim -->
  <text x="706" y="436" class="mono" font-size="11.5" fill="#9a9184">rows 3–5 are painted in full, then veiled by the modal’s scrim.</text>
  <text x="706" y="454" class="mono" font-size="11.5" fill="#9a9184">the blur is a blurred panel — not a lock. nothing behind it is missing.</text>
</svg>
